<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Errore Pagamento - Kebab Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-gray-800 p-8 rounded-lg shadow-xl text-center max-w-md w-full border border-red-500">
        <div class="text-6xl mb-4">❌</div>
        <h1 class="text-2xl font-bold text-red-400 mb-2">Errore di Pagamento</h1>
        <p class="text-gray-300 text-sm mb-4">Si è verificato un problema con la sessione di pagamento:</p>
        <div class="bg-gray-900 p-3 rounded text-red-300 text-xs font-mono mb-6 text-left overflow-x-auto">
            {{ errore }}
        </div>
        <a href="{% url 'menu' %}" class="bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold py-2.5 px-6 rounded transition block w-full">
            Torna al Menu 🥙
        </a>
    </div>
</body>
</html>
